<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Navigation Menu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f4f4f4; }

    /* ---------- Navigation bar using Flexbox ---------- */
    nav { background: #111; }
    .menu {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    .menu li { position: relative; }
    .menu a {
      display: block;
      padding: 16px 22px;
      color: #fff;
      text-decoration: none;
    }
    .menu a:hover { background: #333; }
    .menu .login a { background: #0d6efd; }

    /* ---------- Hover drop-down menu ---------- */
    .dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 180px;
      background: #222;
      list-style: none;
      z-index: 10;
    }
    .menu li:hover > .dropdown { display: block; }
    .dropdown a { padding: 12px 18px; }

    /* ---------- Plan cards using CSS Grid ---------- */
    .plans {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 30px;
    }
    .card {
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }
    .card h3 { margin-bottom: 10px; color: #0d6efd; }

    /* ---------- Responsive layout ---------- */
    @media (max-width: 600px) {
      .menu { flex-direction: column; align-items: stretch; text-align: center; }
      .dropdown { position: static; }
    }
  </style>
</head>
<body>

  <nav>
    <ul class="menu">
      <li>
        <a href="#">Blog &#9662;</a>
        <ul class="dropdown">
          <li><a href="#">Latest Posts</a></li>
          <li><a href="#">Tutorials</a></li>
        </ul>
      </li>
      <li>
        <a href="#">Plans &#9662;</a>
        <ul class="dropdown">
          <li><a href="#">Freelancer</a></li>
          <li><a href="#">Startup</a></li>
          <li><a href="#">Enterprise</a></li>
        </ul>
      </li>
      <li><a href="#">Contact</a></li>
      <li class="login"><a href="#">Log In</a></li>
      <li><a href="#">Sign Up</a></li>
    </ul>
  </nav>

  <section class="plans">
    <div class="card"><h3>Freelancer</h3><p>For individuals</p></div>
    <div class="card"><h3>Startup</h3><p>For small teams</p></div>
    <div class="card"><h3>Enterprise</h3><p>For large companies</p></div>
  </section>

</body>
</html>
